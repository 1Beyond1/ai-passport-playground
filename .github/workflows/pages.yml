name: Deploy Web Simulator to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "projects/desktop-monitor/tools/simulator/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Simulator Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage static simulator assets
        run: |
          mkdir -p _site
          cp projects/desktop-monitor/tools/simulator/index.html \
             projects/desktop-monitor/tools/simulator/styles.css \
             projects/desktop-monitor/tools/simulator/pcstat.js \
             projects/desktop-monitor/tools/simulator/app.js \
             projects/desktop-monitor/tools/simulator/favicon.svg \
             _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
